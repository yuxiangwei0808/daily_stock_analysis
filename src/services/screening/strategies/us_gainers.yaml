name: us_gainers
display_name: US session gainers
description: Fresh session movers in the configured US universe; research candidates, not trade signals.
version: "1"
category: trend
tags: [us, session, movers]
screening:
  enabled: true
  market_scope: [us]
  hard_filters:
    exclude_st: false
    price_min: 5.0
    amount_min: 1000000
    change_pct_min: 2.0
  factor_weights:
    momentum: 0.7
    liquidity: 0.3
  max_output: 10
  ranking_hints: Rank observed session moves only. Do not infer a catalyst or predict continuation.
